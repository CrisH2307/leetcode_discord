<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LeetCode Discord Presence</title>
    <style>
      body { font: 13px/1.4 system-ui, sans-serif; width: 260px; margin: 0; padding: 14px; color: #1f2328; }
      h1 { font-size: 14px; margin: 0 0 10px; }
      label { display: flex; align-items: center; gap: 8px; margin: 8px 0; cursor: pointer; }
      #status { margin-top: 12px; padding-top: 10px; border-top: 1px solid #d0d7de; color: #57606a; }
      #status b { color: #1f2328; }
      #status button { margin: 6px 0; padding: 4px 10px; font: inherit; cursor: pointer; }
      @media (prefers-color-scheme: dark) {
        body { background: #1e1f22; color: #e6e6e6; }
        #status { border-color: #3a3c40; color: #a0a4aa; }
        #status b { color: #e6e6e6; }
      }
    </style>
  </head>
  <body>
    <h1>LeetCode Discord Presence</h1>
    <label><input type="checkbox" id="enabled" /> Show on Discord</label>
    <label><input type="checkbox" id="hideTitle" /> Hide problem title</label>
    <label><input type="checkbox" id="showTopics" /> Show topics (Heap, DP, ...)</label>
    <div id="status">Checking local server...</div>
    <script src="popup.js"></script>
  </body>
</html>
